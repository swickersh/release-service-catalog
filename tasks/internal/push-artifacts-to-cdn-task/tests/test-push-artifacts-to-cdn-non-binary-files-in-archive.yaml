---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-artifacts-to-cdn-non-binary-files-in-archive
spec:
  description: |
    Test that archives containing non-binary files (e.g., README.md, README.MD,
    NOTES.TXT, LICENSE) alongside actual binaries are handled correctly. The
    docs/license files should be skipped during signing but still flow through
    to checksums, compression, and publishing.
  tasks:
    - name: run-task
      taskRef:
        name: push-artifacts-to-cdn-task
      params:
        - name: snapshot_json
          value: >-
            {
              "application": "readme-in-archive-test",
              "artifacts": {},
              "components": [
                {
                  "containerImage": "quay.io/org/tenant/test@sha256:readmetest789",
                  "contentGateway": {
                    "productCode": "Code",
                    "productName": "ReadmeTest",
                    "productVersionName": "1.0-staging"
                  },
                  "name": "readmetest",
                  "staged": {
                    "destination": "readmetest-amd64",
                    "version": "1.0"
                  },
                  "files": [
                    {
                      "filename": "readmetest-binary-windows-amd64.tar.gz",
                      "source": "/releases/readmetest-binary-windows-amd64.tar.gz",
                      "os": "windows",
                      "arch": "amd64"
                    },
                    {
                      "filename": "readmetest-binary-darwin-amd64.tar.gz",
                      "source": "/releases/readmetest-binary-darwin-amd64.tar.gz",
                      "os": "darwin",
                      "arch": "amd64"
                    },
                    {
                      "filename": "readmetest-binary-linux-amd64.tar.gz",
                      "source": "/releases/readmetest-binary-linux-amd64.tar.gz",
                      "os": "linux",
                      "arch": "amd64"
                    }
                  ]
                }
              ]
            }
        - name: exodusGwSecret
          value: "pulp-task-exodus-secret"
        - name: exodusGwEnv
          value: "pre"
        - name: pulpSecret
          value: "pulp-task-pulp-secret"
        - name: udcacheSecret
          value: "pulp-task-udc-secret"
        - name: cgwHostname
          value: "https://content-gateway.com"
        - name: cgwSecret
          value: "pulp-task-cgw-secret"
        - name: author
          value: testuser
        - name: signingKeyName
          value: testkey
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: result
          value: $(tasks.run-task.results.result)
      taskSpec:
        params:
          - name: result
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -ex

              # The task should succeed even with docs/license files in archives.
              # Non-binary files (.md/.txt in any case and LICENSE) are skipped
              # during Mac/Windows signing
              # but still flow through to checksums, compression, and publishing.
              if [[ "$(params.result)" != "Success" ]]; then
                echo "Error: expected Success but got: $(params.result)"
                echo "Archives with non-binary files should not break the pipeline"
                exit 1
              fi

              echo "Test passed: Pipeline succeeded with docs/license files in archives"
