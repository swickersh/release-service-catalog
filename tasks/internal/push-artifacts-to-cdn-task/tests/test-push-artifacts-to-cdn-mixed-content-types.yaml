---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-artifacts-to-cdn-mixed-content-types
spec:
  description: |
    Run the push-artifacts task with mixed content types (binary and generic)
    to verify per-component handling works correctly - binary gets signed,
    generic skips signing
  tasks:
    - name: run-task
      taskRef:
        name: push-artifacts-to-cdn-task
      params:
        - name: snapshot_json
          value: >-
            {
              "application": "mixed-content-app",
              "artifacts": {},
              "components": [
                {
                  "containerImage": "quay.io/org/tenant/binary-component@sha256:abcdef12345",
                  "contentType": "binary",
                  "name": "testproduct",
                  "staged": {
                    "destination": "binary-product-files",
                    "version": "1.0",
                    "files": [
                      {
                        "filename": "binary-windows-amd64.zip",
                        "source": "/releases/testproduct-binary-windows-amd64.tar.gz"
                      },
                      {
                        "filename": "binary-darwin-amd64.tar.gz",
                        "source": "/releases/testproduct-binary-darwin-amd64.tar.gz"
                      },
                      {
                        "filename": "binary-linux-amd64.tar.gz",
                        "source": "/releases/testproduct-binary-linux-amd64.tar.gz"
                      }
                    ]
                  }
                },
                {
                  "containerImage": "quay.io/org/tenant/generic-component@sha256:ghijkl67890",
                  "contentType": "generic",
                  "name": "testproduct2",
                  "staged": {
                    "destination": "generic-product-files",
                    "version": "1.0",
                    "files": [
                      {
                        "filename": "generic-artifact.tar.gz",
                        "source": "/releases/testproduct2-binary-linux-amd64.tar.gz"
                      }
                    ]
                  }
                }
              ]
            }
        - name: exodusGwSecret
          value: "pulp-task-exodus-secret"
        - name: exodusGwEnv
          value: "pre"
        - name: pulpSecret
          value: "pulp-task-pulp-secret"
        - name: udcacheSecret
          value: "pulp-task-udc-secret"
        - name: cgwHostname
          value: "https://content-gateway.com"
        - name: cgwSecret
          value: "pulp-task-cgw-secret"
        - name: author
          value: testuser
        - name: signingKeyName
          value: testkey
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: result
          value: $(tasks.run-task.results.result)
        - name: publishedFiles
          value: $(tasks.run-task.results.publishedFiles)
      taskSpec:
        params:
          - name: result
            type: string
          - name: publishedFiles
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils:7072b5b5aa2cc0fc44baf8fb9f8e4a3540fc4fed
            script: |
              #!/usr/bin/env bash
              set -ex

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Error: result task result expected to be Success but was not"
                exit 1
              fi

              echo "Published files:"
              echo "$(params.publishedFiles)"

              # Verify binary component (testproduct) has sha256sum.txt (checksums generated)
              if ! echo "$(params.publishedFiles)" | grep -q '^testproduct/ready_for_distribution/sha256sum\.txt$'; then
                echo "Error: binary component (testproduct) should have sha256sum.txt"
                exit 1
              fi

              # Verify generic component (testproduct2) does NOT have sha256sum.txt
              if echo "$(params.publishedFiles)" | grep -q '^testproduct2/ready_for_distribution/sha256sum\.txt'; then
                echo "Error: generic component (testproduct2) should NOT have sha256sum.txt"
                exit 1
              fi

              # Verify both components have files in their directories
              if ! echo "$(params.publishedFiles)" | grep -q '^testproduct/ready_for_distribution/'; then
                echo "Error: testproduct files missing"
                exit 1
              fi
              if ! echo "$(params.publishedFiles)" | grep -q '^testproduct2/ready_for_distribution/'; then
                echo "Error: testproduct2 files missing"
                exit 1
              fi

              echo "Test passed: mixed content (binary has checksums, generic does not)"

